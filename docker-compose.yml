version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalconnect-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-calmstacks-legalconnect-secret-jwt-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-legalconnect}:${POSTGRES_PASSWORD:-calmstacks2026}@postgres:5432/${POSTGRES_DB:-legalconnect_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: legalconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calmstacks2026}
      POSTGRES_DB: ${POSTGRES_DB:-legalconnect_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./contracts/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalconnect -d legalconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
